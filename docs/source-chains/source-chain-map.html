  const relations=data.edges.filter(e=>e.program_key===p.key);if(relations.length){const ds=details('文件關係（'+relations.length+'）'),ul=el('ul','edges');for(const e of relations){const li=el('li');li.append(document.createTextNode(data.documents[e.source].title+' → '+data.documents[e.target].title),el('div','note',(role[e.role]||e.role)+' · '+origin[e.origin]));ul.append(li);}ds.append(ul);body.append(ds);}
  const ids=details('候選紀錄 ID');ids.append(el('pre','',p.candidate_ids.join('\n')));body.append(ids);article.append(body);$('programs').append(article);
 }
 $('visible').textContent='目前顯示 '+count+' 組方案；本批'+data.summary.batch_programs+'組皆仍有待查缺口，未自動發布規則。';if(!count)$('programs').append(el('p','empty','沒有符合條件的文件；請調整搜尋或狀態。'));
}
