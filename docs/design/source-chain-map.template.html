<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>OpenGSA｜來源資訊鏈地圖</title>
<style>
:root{--ink:#23473e;--muted:#65746e;--line:#d5dfd6;--paper:#f6f5ef}*{box-sizing:border-box}body{margin:0;font:14px/1.65 "Microsoft JhengHei",system-ui,sans-serif;background:var(--paper);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:22px max(20px,calc((100vw - 1160px)/2))}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px;margin:0}h3{font-size:14px;margin:16px 0 8px}p{margin:7px 0}a{color:#245f62;text-underline-offset:3px;overflow-wrap:anywhere}.lead{max-width:1000px;color:var(--muted)}.actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}.wrap{max-width:1200px;padding:20px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px}.stat strong{font-size:22px;margin-right:6px}.tools{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:#fff;padding:14px;border:1px solid var(--line);border-radius:10px;position:sticky;top:0;z-index:5}.tools label{font-size:12px;display:grid;gap:4px}.tools input,.tools select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff;max-width:100%}.tools label:first-child{flex:1;min-width:180px}.tools input{width:100%}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:14px 0}.pill{display:inline-block;border-radius:6px;font-size:11px;padding:2px 7px;background:#e6ebe6;color:#4c6257;white-space:nowrap}.read{background:#e2efe6;color:#21583e}.snapshot{background:#fff0c4;color:#6b5019}.unread{background:#ffead2;color:#7b4a13}.blocked{background:#fbe3de;color:#8b3329}.program{margin:16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.program>summary{padding:16px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;list-style:none}.program>summary::before{content:'＋';font-size:20px}.program[open]>summary::before{content:'－'}.program>summary .meta{font-size:12px;color:var(--muted);margin-left:auto}.body{padding:0 18px 18px}.tree{padding-left:18px;border-left:2px solid #d5e1d5;margin:10px 0 16px 10px}.doc{margin:8px 0 8px 7px;border:1px solid var(--line);border-radius:8px;background:#fcfdfa}.doc>summary{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;list-style:none}.doc>summary::before{content:'›'}.doc[open]>summary::before{content:'⌄'}.doc .title{flex:1;min-width:140px;overflow-wrap:anywhere}.doc-body{padding:0 14px 12px;font-size:12px;color:var(--muted)}code{overflow-wrap:anywhere;font-size:11px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4ee;padding:12px;border-radius:8px;font-size:12px}.gaps{border-left:3px solid #d7ac58;padding:10px 14px;background:#fff7e5;font-size:12px}.gaps ul{padding-left:18px;margin:5px 0}.rules{list-style:none;padding:0}.rules>li{border-top:1px solid #e6ebe5;padding:12px 0}.rules strong{font-size:13px}.rules .meta{font-size:11px;color:var(--muted)}.evidence{font-size:12px}.edges{font-size:12px;padding-left:18px;overflow-wrap:anywhere}.edges li{margin:9px 0}.note{font-size:12px;color:var(--muted)}summary:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b16c34;outline-offset:3px}.empty{background:#fff;padding:22px;border:1px solid var(--line);border-radius:10px}footer{font-size:12px;color:var(--muted);padding:24px 20px;max-width:1200px;margin:auto}@media(max-width:600px){header{padding:18px}.wrap{padding:12px}.tools{position:static;align-items:stretch}.tools label{flex:1;min-width:0!important}.tools label:first-child{flex-basis:100%}.stats{gap:6px}.stat{padding:6px 10px}.program>summary{padding:12px}.program>summary .meta{margin-left:0;width:100%}.body{padding:0 12px 12px}.tree{padding-left:8px;margin-left:3px}.doc>summary{padding:8px}.doc .title{min-width:100%;order:2}.doc>summary::before{display:none}}
</style></head><body>
<header><h1>OpenGSA · 來源資訊鏈地圖</h1><p class="lead">方案 → 不同年度／適用單位的文件 → 時間規則與證據。資料是待審研究層；來源能讀取，不代表規則完整、申請開放或人工核准。</p><div class="actions"><a href="source-chain-map.canvas" download>下載 Obsidian Canvas ↗</a><a href="https://github.com/matt-ye/opengsa" target="_blank" rel="noopener noreferrer">專案與版本 ↗</a></div></header>
<main class="wrap"><div class="stats" id="stats"></div><div class="tools"><label>搜尋方案／文件<input type="search" id="query" placeholder="例如：基金會、千里馬、PDF…"></label><label>批次<select id="stage"><option value="batch">本批補鏈</option><option value="all">全部既有候選</option><option value="baseline">尚待下一批</option></select></label><label>文件狀態<select id="status"><option value="all">全部狀態</option><option value="read">已讀取</option><option value="snapshot">既有快照</option><option value="unread">連結未讀</option><option value="blocked">受阻</option></select></label></div><div class="legend"><span class="pill read">已讀取</span><span class="pill snapshot">既有快照</span><span class="pill unread">只找到連結</span><span class="pill blocked">掃描受阻</span></div><p class="note" id="visible" role="status" aria-live="polite"></p><div id="programs"></div><details><summary>範圍與請求紀錄</summary><ul id="notes" class="note"></ul></details></main><footer>樹狀圖與 Canvas 由同一份 JSON 產生。觀察到的超連結與配置的脈絡關係分開標示；沒有儲存原始 PDF／HTML、私人表單或帳密。未列入本批的資源保持下一批待查。</footer>
<script id="graph-data" type="application/json">/*GRAPH_DATA*/</script><script>
const data=JSON.parse(document.getElementById('graph-data').textContent),$=id=>document.getElementById(id);
const role={policy:'辦法／法源',annual_call:'年度公告',local_intake:'地方收件',local_process:'校內流程',forms_index:'表格入口',application_system:'申辦入口',attachment:'附件／表單',candidate_source:'原候選來源',related_call:'待核關聯'};
const state={read:'已讀取',snapshot:'既有快照',unread:'只找到連結',blocked:'掃描受阻'},origin={observed_link:'已觀察到的超連結',registry_context:'配置的脈絡關係，非原頁超連結',baseline_relation:'PR31基線關係，本批未逐邊重核'};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n;}
function link(text,url){const a=el('a','',text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function details(title){const d=el('details');d.append(el('summary','',title));return d;}
for(const [key,label] of [['programs','組方案'],['candidates','筆候選'],['documents','個文件節點'],['relations','條關係'],['rules','筆待審規則']]){const s=el('div','stat');s.append(el('strong','',String(data.summary[key])),document.createTextNode(label));$('stats').append(s);}
for(const note of data.notes)$('notes').append(el('li','',note));
function draw(){
 $('programs').replaceChildren();let count=0;
 for(const p of data.programs){
  const batch=p.audited_batch===data.current_batch;if($('stage').value==='batch'&&!batch||$('stage').value==='baseline'&&p.audit_status!=='baseline_pending')continue;
  let docs=p.document_ids.map(id=>data.documents[id]);const query=$('query').value.trim().toLowerCase();
  if(query&&!p.title.toLowerCase().includes(query))docs=docs.filter(d=>(d.title+' '+d.url+' '+d.format).toLowerCase().includes(query));
  if($('status').value!=='all')docs=docs.filter(d=>d.clarity===$('status').value);if(!docs.length)continue;count++;
  const article=el('details','program');article.open=batch;const summary=el('summary');summary.append(el('h2','',p.title),el('span','pill '+(batch?'read':'snapshot'),batch?'本批部分補鏈':p.audit_status==='partial'?'先前批次部分補鏈':'待下一批'),el('span','meta',p.candidate_ids.length+'筆候選 · '+docs.length+'份文件'));article.append(summary);
  const body=el('div','body'),gaps=el('div','gaps');gaps.append(el('strong','','尚未閉合／需確認'));const list=el('ul');p.gaps.forEach(g=>list.append(el('li','',g)));gaps.append(list);body.append(gaps);
  body.append(el('h3','','文件樹（同文件可跨方案共用）'));const tree=el('div','tree');
  for(const d of docs){const node=el('details','doc'),head=el('summary');const context=p.source_contexts.find(c=>c.url===d.url);head.append(el('span','pill '+d.clarity,state[d.clarity]),el('span','title',d.title),el('span','pill',d.format==='unknown'?'格式待驗':d.format.toUpperCase()));node.append(head);
   const info=el('div','doc-body');info.append(el('p','',(role[context?.role||d.role]||'相關文件')+(context?' · '+context.scope+' · '+context.cycle:'')),link('開啟官方來源 ↗',d.url),el('p','','觀察：'+d.observed_at+' · 狀態：'+d.status),el('code','',d.id),el('p','','來源版本：'+(d.revision_id||'尚未取得')));
   if(d.links?.length){const discovered=details('本頁發現的連結（未全部歸屬或讀取）');for(const l of d.links){const line=el('p');line.append(link(l.label||l.url,l.url));discovered.append(line);}info.append(discovered);}node.append(info);tree.append(node);
  }body.append(tree);
  if(p.rules.length){body.append(el('h3','','待審規則（角色／範圍分開）'));const rules=el('ul','rules');for(const r of p.rules){const li=el('li');li.append(el('strong','',r.summary),el('div','meta',r.actor+' · '+r.scope+' · '+r.cycle+' · '+r.review_status));const values=details('查看結構化欄位與來源證據');values.append(el('pre','',JSON.stringify(r.value,null,2)));for(const ref of r.evidence_refs){const d=data.documents[ref.document_id],ev=el('p','evidence');ev.append(link(d.title+' ↗',d.url),el('span','',' · '+ref.locator),el('p','','block SHA256：'+ref.block_sha256));values.append(ev);}li.append(values);rules.append(li);}body.append(rules);}
  const relations=data.edges.filter(e=>e.program_key===p.key);if(relations.length){const ds=details('文件關係（'+relations.length+'）'),ul=el('ul','edges');for(const e of relations){const li=el('li');li.append(document.createTextNode(data.documents[e.source].title+' → '+data.documents[e.target].title),el('div','note',(role[e.role]||e.role)+' · '+origin[e.origin]));ul.append(li);}ds.append(ul);body.append(ds);}
  const ids=details('候選紀錄 ID');ids.append(el('pre','',p.candidate_ids.join('\n')));body.append(ids);article.append(body);$('programs').append(article);
 }
 $('visible').textContent='目前顯示 '+count+' 組方案；本批'+data.summary.batch_programs+'組皆仍有待查缺口，未自動發布規則。';if(!count)$('programs').append(el('p','empty','沒有符合條件的文件；請調整搜尋或狀態。'));
}
$('query').addEventListener('input',draw);$('stage').addEventListener('change',draw);$('status').addEventListener('change',draw);draw();
</script></body></html>
