name: Scan public sources

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'scan or manual provider metadata / synthetic audit'
        type: choice
        default: scan
        options: [scan, provider_audit]
      model_provider:
        description: 'One provider; quota failures fall back to rules, never a paid model'
        type: choice
        default: groq
        options: [groq, gemini, nvidia, sambanova, cerebras, openrouter, siliconflow, mistral]
      probe:
        description: 'At most one synthetic inference per eligible provider; others metadata only'
        type: boolean
        default: false
      model_mode:
        description: 'Model mode for short_excerpt sources (off / audit / extract / both; schedule always uses off)'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'audit'
          - 'extract'
          - 'both'
  schedule:
    # Asia/Taipei 週二、週五09:17；避開整點，GitHub排程不保證準時。排程強制使用 model_mode=off。
    - cron: '17 1 * * 2,5'

permissions:
  contents: read

concurrency:
  group: public-source-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'provider_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore observed hashes and pending review queue
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: work/scanner/state.json
          key: source-scan-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-scan-v1-main-
      - name: Install extraction dependencies
        run: python -m pip install -r requirements-ingestion.txt
      - name: Bounded public scan
        env:
          REQUESTED_MODEL_MODE: ${{ github.event_name == 'schedule' && 'off' || inputs.model_mode || 'off' }}
          OPENGSA_MODEL_PROVIDER: ${{ inputs.model_provider || 'groq' }}
          OPENGSA_MODEL_BASE_URL: ${{ vars.OPENGSA_MODEL_BASE_URL }}
          OPENGSA_MODEL_NAME: ${{ vars.OPENGSA_MODEL_NAME }}
          OPENGSA_SILICONFLOW_REGION: ${{ vars.OPENGSA_SILICONFLOW_REGION }}
          OPENGSA_SELECTED_API_KEY: ${{ secrets[fromJSON('{"groq":"OPENGSA_MODEL_API_KEY","gemini":"OPENGSA_GEMINI_API_KEY","nvidia":"OPENGSA_NVIDIA_API_KEY","sambanova":"OPENGSA_SAMBANOVA_API_KEY","cerebras":"OPENGSA_CEREBRAS_API_KEY","openrouter":"OPENGSA_OPENROUTER_API_KEY","siliconflow":"OPENGSA_SILICONFLOW_API_KEY","mistral":"OPENGSA_MISTRAL_API_KEY"}')[inputs.model_provider || 'groq']] }}
        shell: bash
        run: |
          if [ -n "$OPENGSA_SELECTED_API_KEY" ]; then
            export OPENGSA_MODEL_MODE="$REQUESTED_MODEL_MODE"
          else
            export OPENGSA_MODEL_MODE="off"
          fi
          python scripts/scan_sources.py
      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          if [ -f work/scanner/report/summary.md ]; then
            cat work/scanner/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/scanner/report/review-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat work/scanner/report/review-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/scanner/report/model-usage.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 模型使用與邊界統計 (model-usage.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat work/scanner/report/model-usage.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate report only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-scan-${{ github.run_id }}
          path: work/scanner/report/
          retention-days: 14
          if-no-files-found: warn

  provider-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'provider_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Catalog and bounded synthetic audit (no source data)
        env:
          PROBE: ${{ inputs.probe }}
          OPENGSA_MODEL_BASE_URL: ${{ vars.OPENGSA_MODEL_BASE_URL }}
          OPENGSA_MODEL_NAME: ${{ vars.OPENGSA_MODEL_NAME }}
          OPENGSA_SILICONFLOW_REGION: ${{ vars.OPENGSA_SILICONFLOW_REGION }}
          OPENGSA_MODEL_API_KEY: ${{ secrets.OPENGSA_MODEL_API_KEY }}
          OPENGSA_GEMINI_API_KEY: ${{ secrets.OPENGSA_GEMINI_API_KEY }}
          OPENGSA_NVIDIA_API_KEY: ${{ secrets.OPENGSA_NVIDIA_API_KEY }}
          OPENGSA_SAMBANOVA_API_KEY: ${{ secrets.OPENGSA_SAMBANOVA_API_KEY }}
          OPENGSA_CEREBRAS_API_KEY: ${{ secrets.OPENGSA_CEREBRAS_API_KEY }}
          OPENGSA_OPENROUTER_API_KEY: ${{ secrets.OPENGSA_OPENROUTER_API_KEY }}
          OPENGSA_SILICONFLOW_API_KEY: ${{ secrets.OPENGSA_SILICONFLOW_API_KEY }}
          OPENGSA_MISTRAL_API_KEY: ${{ secrets.OPENGSA_MISTRAL_API_KEY }}
        run: |
          if [ "$PROBE" = "true" ]; then
            python scripts/audit_providers.py --probe
          else
            python scripts/audit_providers.py
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: provider-audit-${{ github.run_id }}
          path: work/provider-audit/report.json
          retention-days: 14
