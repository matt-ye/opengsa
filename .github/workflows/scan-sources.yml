name: Scan public sources

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'scan, provider audit, or offline named-candidate review workspace'
        type: choice
        default: scan
        options: [scan, provider_audit, review_workspace, source_chains, temporal_replay]
      temporal_source_ids:
        description: 'Temporal replay only: 1-8 existing source IDs (or track:gov / track:enterprise / track:other / auto)'
        type: string
        default: 'taipei-ai-tools,hsinchu-ai-tools'
      schedule_track:
        description: 'Outer schedule track routing (gov: Tue/Fri, enterprise: Mon/Thu, other: Wed/Sat)'
        type: choice
        default: auto
        options: [auto, gov, enterprise, other, all]
      incremental_only:
        description: 'Only run NEW, CHANGED, or BACKFILL sources (0 HTTP / 0 Token for unchanged resolved sources)'
        type: boolean
        default: true
      temporal_attachments:
        description: 'Follow one directly linked same-host announcement PDF; source GET budget still 20'
        type: boolean
        default: false
      audit_scope:
        description: 'Provider audit scope (avoids repeating successful probes)'
        type: choice
        default: all
        options: [all, groq, gemini, nvidia, sambanova, cerebras, openrouter, siliconflow, mistral]
      model_provider:
        description: 'auto_pool (8-provider failover pool) or a specific provider; never uses paid models'
        type: choice
        default: auto_pool
        options: [auto_pool, groq, gemini, nvidia, sambanova, cerebras, openrouter, siliconflow, mistral]
      probe:
        description: 'At most one synthetic inference per eligible provider; others metadata only'
        type: boolean
        default: false
      model_mode:
        description: 'Model mode for short_excerpt sources (off / audit / extract / both; schedule always uses off)'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'audit'
          - 'extract'
          - 'both'
  schedule:
    # Asia/Taipei 週二、週五09:17（公部門 gov 軌）、週一、週四09:17（企業/基金會 enterprise 軌）、週三、週六09:17（AI工具與其他 other 軌）。排程強制使用 model_mode=off。
    - cron: '17 1 * * 2,5'
    - cron: '17 1 * * 1,4'
    - cron: '17 1 * * 3,6'

permissions:
  contents: read

concurrency:
  group: public-source-scan
  cancel-in-progress: false

jobs:
  temporal-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'temporal_replay' && github.actor == github.repository_owner && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore temporal batch harness checkpoint
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: work/temporal-harness/checkpoint.json
          key: temporal-harness-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: temporal-harness-v1-${{ github.ref_name }}-
      - name: Install optional manual model dependencies (no secrets)
        run: python -m pip install -r requirements-model.txt
      - name: Manual temporal extraction and independent evidence checks
        env:
          TEMPORAL_SOURCE_IDS: ${{ inputs.temporal_source_ids }}
          TEMPORAL_TRACK: ${{ inputs.schedule_track || 'auto' }}
          INCREMENTAL_ONLY: ${{ inputs.incremental_only }}
          FOLLOW_ATTACHMENTS: ${{ inputs.temporal_attachments }}
          OPENGSA_MODEL_MODE: ${{ inputs.model_mode || 'off' }}
          OPENGSA_MODEL_PROVIDER: ${{ inputs.model_provider || 'auto_pool' }}
          OPENGSA_MODEL_BASE_URL: ${{ vars.OPENGSA_MODEL_BASE_URL }}
          OPENGSA_MODEL_NAME: ${{ vars.OPENGSA_MODEL_NAME }}
          OPENGSA_SILICONFLOW_REGION: ${{ vars.OPENGSA_SILICONFLOW_REGION || 'com' }}
          OPENGSA_MODEL_API_KEY: ${{ secrets.OPENGSA_MODEL_API_KEY }}
          OPENGSA_GROQ_API_KEY: ${{ secrets.OPENGSA_MODEL_API_KEY }}
          OPENGSA_GEMINI_API_KEY: ${{ secrets.OPENGSA_GEMINI_API_KEY }}
          OPENGSA_NVIDIA_API_KEY: ${{ secrets.OPENGSA_NVIDIA_API_KEY }}
          OPENGSA_SAMBANOVA_API_KEY: ${{ secrets.OPENGSA_SAMBANOVA_API_KEY }}
          OPENGSA_CEREBRAS_API_KEY: ${{ secrets.OPENGSA_CEREBRAS_API_KEY }}
          OPENGSA_OPENROUTER_API_KEY: ${{ secrets.OPENGSA_OPENROUTER_API_KEY }}
          OPENGSA_SILICONFLOW_API_KEY: ${{ secrets.OPENGSA_SILICONFLOW_API_KEY }}
          OPENGSA_MISTRAL_API_KEY: ${{ secrets.OPENGSA_MISTRAL_API_KEY }}
        shell: bash
        run: |
          args=(--checkpoint work/temporal-harness/checkpoint.json)
          if [ "$FOLLOW_ATTACHMENTS" = "true" ]; then args+=(--attachments); fi
          if [ "$INCREMENTAL_ONLY" = "true" ]; then args+=(--incremental-only); fi
          python scripts/run_temporal_action.py "${args[@]}"
      - name: Temporal summary
        if: always()
        shell: bash
        run: |
          if [ -f work/temporal-action/summary.md ]; then
            cat work/temporal-action/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: temporal-review-${{ github.run_id }}
          path: work/temporal-action/
          retention-days: 14
          if-no-files-found: error

  scan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.operation == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_proposal: ${{ steps.proposal.outputs.has_proposal }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore observed hashes and pending review queue
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: work/scanner/state.json
          key: source-scan-v2-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-scan-v2-main-
      - name: Install extraction dependencies
        run: python -m pip install -r requirements-ingestion.txt
      - name: Bounded public scan
        env:
          REQUESTED_MODEL_MODE: ${{ github.event_name == 'schedule' && 'off' || inputs.model_mode || 'off' }}
          OPENGSA_MODEL_PROVIDER: ${{ inputs.model_provider == 'auto_pool' && 'groq' || inputs.model_provider || 'groq' }}
          OPENGSA_MODEL_BASE_URL: ${{ vars.OPENGSA_MODEL_BASE_URL }}
          OPENGSA_MODEL_NAME: ${{ vars.OPENGSA_MODEL_NAME }}
          OPENGSA_SILICONFLOW_REGION: ${{ vars.OPENGSA_SILICONFLOW_REGION }}
          OPENGSA_SELECTED_API_KEY: ${{ secrets[fromJSON('{"auto_pool":"OPENGSA_MODEL_API_KEY","groq":"OPENGSA_MODEL_API_KEY","gemini":"OPENGSA_GEMINI_API_KEY","nvidia":"OPENGSA_NVIDIA_API_KEY","sambanova":"OPENGSA_SAMBANOVA_API_KEY","cerebras":"OPENGSA_CEREBRAS_API_KEY","openrouter":"OPENGSA_OPENROUTER_API_KEY","siliconflow":"OPENGSA_SILICONFLOW_API_KEY","mistral":"OPENGSA_MISTRAL_API_KEY"}')[inputs.model_provider || 'groq']] }}
        shell: bash
        run: |
          if [ -n "$OPENGSA_SELECTED_API_KEY" ]; then
            export OPENGSA_MODEL_MODE="$REQUESTED_MODEL_MODE"
          else
            export OPENGSA_MODEL_MODE="off"
          fi
          python scripts/scan_sources.py
      # 掃描失敗也要存：不存的話游標和失敗紀錄都留在原地，下一輪又卡在同一批來源。
      - name: Save observed hashes and pending review queue
        if: always() && hashFiles('work/scanner/state.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: work/scanner/state.json
          key: source-scan-v2-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          if [ -f work/scanner/report/summary.md ]; then
            cat work/scanner/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/scanner/report/review-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat work/scanner/report/review-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/scanner/report/model-usage.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 模型使用與邊界統計 (model-usage.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat work/scanner/report/model-usage.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate report only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-scan-${{ github.run_id }}
          path: work/scanner/report/
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare radar candidate update and offline preview
        if: always() && hashFiles('work/scanner/report/structured-candidates.json') != ''
        id: proposal
        shell: bash
        run: |
          python scripts/propose_radar_update.py --candidates work/scanner/report/structured-candidates.json --temporal work/scanner/report/temporal-records.json --output work/radar-proposal
          python -c "import json;print('has_proposal='+str(json.load(open('work/radar-proposal/summary.json',encoding='utf-8'))['accepted_for_radar_proposal']>0).lower())" >> "$GITHUB_OUTPUT"
      - name: Preserve radar proposal and preview
        if: always() && hashFiles('work/scanner/report/structured-candidates.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: radar-data-proposal-${{ github.run_id }}
          path: work/radar-proposal/
          retention-days: 14
          if-no-files-found: error

  data-pr:
    needs: scan
    if: ${{ always() && needs.scan.outputs.has_proposal == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 全 workflow 唯一有寫入權限的 job。
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 不把權杖留在磁碟上：提案內容來自公開網站，檢查階段碰不到寫入權限。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: radar-data-proposal-${{ github.run_id }}
          path: work/radar-proposal
      - name: Apply the proposal and run the same checks as CI (no token)
        run: |
          python scripts/open_data_pr.py --proposal work/radar-proposal --output work/data-pr --label "排程掃描"
      - name: Push the branch and open the data PR (never merges)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/open_data_pr.py --publish --output work/data-pr --branch data/radar-proposal --title "data: 排程掃描的待審提案"

  review-workspace:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'review_workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ingestion.txt
      - name: Offline named-candidate workspace (no secrets or source GET)
        run: python scripts/build_review_workspace.py --output work/review-workspace
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-review-${{ github.run_id }}
          path: work/review-workspace/
          retention-days: 14
          if-no-files-found: error

  source-chains:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'source_chains'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: work/source-chain/previous.json
          key: source-chain-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-chain-v1-${{ github.ref_name }}-
      - run: python -m pip install -r requirements-dev.txt
      - name: Bounded source-chain extraction (no secrets, models or automatic publication)
        shell: bash
        run: |
          args=()
          if [ -f work/source-chain/previous.json ]; then args+=(--previous work/source-chain/previous.json); fi
          python scripts/source_chains.py "${args[@]}" --output work/source-chain/report/source-chains.json
          cp work/source-chain/report/source-chains.json work/source-chain/previous.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-chains-${{ github.run_id }}
          path: work/source-chain/report/
          retention-days: 14
          if-no-files-found: error

  provider-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'provider_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Catalog and bounded synthetic audit (no source data)
        env:
          PROBE: ${{ inputs.probe }}
          AUDIT_SCOPE: ${{ inputs.audit_scope || 'all' }}
          OPENGSA_MODEL_BASE_URL: ${{ vars.OPENGSA_MODEL_BASE_URL }}
          OPENGSA_MODEL_NAME: ${{ vars.OPENGSA_MODEL_NAME }}
          OPENGSA_SILICONFLOW_REGION: ${{ vars.OPENGSA_SILICONFLOW_REGION }}
          OPENGSA_MODEL_API_KEY: ${{ secrets.OPENGSA_MODEL_API_KEY }}
          OPENGSA_GEMINI_API_KEY: ${{ secrets.OPENGSA_GEMINI_API_KEY }}
          OPENGSA_NVIDIA_API_KEY: ${{ secrets.OPENGSA_NVIDIA_API_KEY }}
          OPENGSA_SAMBANOVA_API_KEY: ${{ secrets.OPENGSA_SAMBANOVA_API_KEY }}
          OPENGSA_CEREBRAS_API_KEY: ${{ secrets.OPENGSA_CEREBRAS_API_KEY }}
          OPENGSA_OPENROUTER_API_KEY: ${{ secrets.OPENGSA_OPENROUTER_API_KEY }}
          OPENGSA_SILICONFLOW_API_KEY: ${{ secrets.OPENGSA_SILICONFLOW_API_KEY }}
          OPENGSA_MISTRAL_API_KEY: ${{ secrets.OPENGSA_MISTRAL_API_KEY }}
        run: |
          args=()
          if [ "$AUDIT_SCOPE" != "all" ]; then args+=(--provider "$AUDIT_SCOPE"); fi
          if [ "$PROBE" = "true" ]; then args+=(--probe); fi
          python scripts/audit_providers.py "${args[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: provider-audit-${{ github.run_id }}
          path: work/provider-audit/report.json
          retention-days: 14
