name: Scan public sources

on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei 週二、週五09:17；避開整點，GitHub排程不保證準時。
    - cron: '17 1 * * 2,5'

permissions:
  contents: read

concurrency:
  group: public-source-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore observed hashes and pending review queue
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: work/scanner/state.json
          key: source-scan-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-scan-v1-main-
      - name: Install extraction dependencies
        run: python -m pip install -r requirements-ingestion.txt
      - name: Bounded public scan
        run: python scripts/scan_sources.py
      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          if [ -f work/scanner/report/summary.md ]; then
            cat work/scanner/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/scanner/report/review-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat work/scanner/report/review-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate report only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-scan-${{ github.run_id }}
          path: work/scanner/report/
          retention-days: 14
          if-no-files-found: warn
