name: Source intake

# 維護者核可提交的來源後才執行。Issue 內容是公開輸入，只透過事件檔由腳本讀取，不可放進 run 指令。
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: source-intake
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.label.name == 'source-approved' && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ingestion.txt
      - name: Validate the approved submission (no source GET)
        run: python scripts/intake_source.py --event "$GITHUB_EVENT_PATH" --output work/intake
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-intake-${{ github.run_id }}
          path: work/intake/
          retention-days: 14
          if-no-files-found: error
      - name: Report back on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file work/intake/comment.md
